[project]
name = "compliance"
version = "0.1.0"
description = "A Python application with MongoDB integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "chromadb>=1.0.7",
    "docx2txt>=0.9",
    "langchain>=0.3.24",
    "lxml>=5.4.0",
    "openai>=1.76.2",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pymongo>=4.6.1",
    "pypdf2>=3.0.1",
    "python-dotenv>=1.0.1",
    "sentence-transformers>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
